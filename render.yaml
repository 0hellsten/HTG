services:
  - type: web
    name: htg-server
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /halsa
    buildCommand: pnpm install && pnpm --filter @stallbacken/shared build && pnpm --filter @stallbacken/server build
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TZ
        value: Europe/Stockholm
      - key: CONTACT_EMAIL
        value: kontakt@stallbacken.local
      - key: DB_PATH
        value: ./data/stallbacken.db
